server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml application/atom+xml
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    # ── Sécurité (en-têtes basiques) ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # ── Cache long pour les assets versionnés (Vite hash dans le nom) ──
    location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy interne /api/* → conteneur API (DNS Docker proxy-net) ──
    # Le site web parle ainsi à la même API Postgres que le mobile,
    # mais via le réseau Docker privé (jamais via Internet).
    # Le DNS "api" est résolu au runtime grâce à un resolver interne.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        # Si l'API est temporairement down → 502 propre plutôt que de planter
        proxy_intercept_errors off;
    }

    # ── index.html jamais en cache ──────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── SPA fallback : toutes les routes renvoient sur index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Healthcheck ─────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
