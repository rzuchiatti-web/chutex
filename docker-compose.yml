version: "3.9"

# ────────────────────────────────────────────────────────────────
#  Chutex Care — stack complète (frontend + API + Postgres)
#  À placer à la RACINE du repo cloné depuis GitHub.
#
#  Démarrage : docker compose up -d --build
#  Arrêt    : docker compose down
#  Logs     : docker compose logs -f
# ────────────────────────────────────────────────────────────────

services:
  # ── Base de données ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chutex_care
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 10

  # ── API FastAPI ────────────────────────────────────────────────
  api:
    build: ./migration
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/chutex_care
      DATABASE_URL_ASYNC: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/chutex_care
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.chutex-care.fr,https://chutex-care.fr}
      MOLLIE_TEST_KEY: ${MOLLIE_TEST_KEY:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://www.chutex-care.fr}
      API_BASE_URL: ${API_BASE_URL:-https://api.chutex-care.fr}
      LOG_LEVEL: INFO
    ports:
      - "${API_PORT:-8000}:8000"

  # ── Frontend (React/Vite servi par nginx) ─────────────────────
  web:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://api.chutex-care.fr}
        REACT_APP_VAPID_KEY: ${REACT_APP_VAPID_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
