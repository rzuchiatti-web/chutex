name: Deploy nginx config

# ─────────────────────────────────────────────────────────────────
#  Copie la config nginx dans /etc/nginx/conf.d/ (universel),
#  vérifie la syntaxe et recharge nginx.
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "infra/nginx/**"
      - ".github/workflows/deploy-nginx.yml"
  workflow_dispatch:

jobs:
  deploy-nginx:
    runs-on: [self-hosted, chutex]
    steps:
      - uses: actions/checkout@v4

      - name: Detect target directory
        id: detect
        run: |
          set -euo pipefail
          if [ -d /etc/nginx/sites-available ] && [ -d /etc/nginx/sites-enabled ]; then
            echo "mode=debian"  >> "$GITHUB_OUTPUT"
            echo "→ Mode Debian (sites-available + sites-enabled)"
          else
            echo "mode=confd" >> "$GITHUB_OUTPUT"
            echo "→ Mode conf.d (universel)"
          fi

      - name: Backup current config
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          for path in /etc/nginx/conf.d/chutex-care.fr.conf \
                     /etc/nginx/sites-available/chutex-care.fr.conf; do
            if [ -f "$path" ]; then
              echo "$SUDO_PASSWORD" | sudo -S cp "$path" "${path}.bak.$(date +%s)"
              echo "→ Backup: $path"
            fi
          done

      - name: Copy config (Debian style)
        if: steps.detect.outputs.mode == 'debian'
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S cp \
            infra/nginx/chutex-care.fr.conf \
            /etc/nginx/sites-available/chutex-care.fr.conf
          echo "$SUDO_PASSWORD" | sudo -S ln -sf \
            /etc/nginx/sites-available/chutex-care.fr.conf \
            /etc/nginx/sites-enabled/chutex-care.fr.conf
          echo "→ Config installée (Debian)"

      - name: Copy config (conf.d style)
        if: steps.detect.outputs.mode == 'confd'
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S mkdir -p /etc/nginx/conf.d
          echo "$SUDO_PASSWORD" | sudo -S cp \
            infra/nginx/chutex-care.fr.conf \
            /etc/nginx/conf.d/chutex-care.fr.conf
          echo "→ Config installée (conf.d)"

      - name: Test nginx config
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S nginx -t

      - name: Reload nginx
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S systemctl reload nginx
          echo "✅ nginx rechargé sans coupure"

      - name: Healthcheck
        run: |
          set -euo pipefail
          sleep 2
          curl -fsSk -H "Host: www.chutex-care.fr" \
            https://127.0.0.1/healthz \
            && echo "✅ Reverse-proxy répond" \
            || (echo "⚠ healthcheck KO (peut-être normal si conteneur pas encore up)" && exit 0)
