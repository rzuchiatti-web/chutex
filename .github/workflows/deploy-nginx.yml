name: Deploy nginx config

# ─────────────────────────────────────────────────────────────────
#  ⚠ Cette version utilise SUDO_PASSWORD (secret GitHub) au lieu
#  de NOPASSWD sudoers. Moins sécurisé : un leak du secret donne
#  un accès root complet au serveur.
#
#  Recommandation : préférer la version NOPASSWD (voir doc).
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "infra/nginx/**"
      - ".github/workflows/deploy-nginx.yml"
  workflow_dispatch:

jobs:
  deploy-nginx:
    runs-on: [self-hosted, chutex]
    env:
      SUDO_ASKPASS_CMD: 'echo "$SUDO_PASSWORD" | sudo -S'
    steps:
      - uses: actions/checkout@v4

      - name: Backup current config
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f /etc/nginx/sites-available/chutex-care.fr.conf ]; then
            echo "$SUDO_PASSWORD" | sudo -S cp \
              /etc/nginx/sites-available/chutex-care.fr.conf \
              /etc/nginx/sites-available/chutex-care.fr.conf.bak.$(date +%s)
            echo "→ Backup créé"
          else
            echo "→ Pas de config existante, premier déploiement"
          fi

      - name: Copy config
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S cp \
            infra/nginx/chutex-care.fr.conf \
            /etc/nginx/sites-available/chutex-care.fr.conf
          echo "$SUDO_PASSWORD" | sudo -S ln -sf \
            /etc/nginx/sites-available/chutex-care.fr.conf \
            /etc/nginx/sites-enabled/chutex-care.fr.conf
          echo "→ Config copiée et activée"

      - name: Test nginx config
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S nginx -t

      - name: Reload nginx
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S systemctl reload nginx
          echo "✅ nginx rechargé sans coupure"

      - name: Healthcheck (HTTPS)
        run: |
          set -euo pipefail
          sleep 2
          curl -fsSk -H "Host: www.chutex-care.fr" \
            https://127.0.0.1/healthz \
            && echo "✅ Reverse-proxy répond" \
            || (echo "⚠ healthcheck KO (peut-être normal si conteneur pas encore up)" && exit 0)
