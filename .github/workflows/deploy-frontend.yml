name: Deploy frontend

# ─────────────────────────────────────────────────────────────────
#  Build l'image Docker du site web (React/Vite + nginx)
#  et redémarre le conteneur — directement sur ton serveur via le
#  runner self-hosted taggé "chutex".
#
#  Variables (Settings → Secrets and variables → Actions → Variables) :
#    - REACT_APP_BACKEND_URL : ex. https://api.chutex-care.fr
#    - REACT_APP_VAPID_KEY   : (optionnel) clé publique web-push
#    - WEB_PORT              : ex. 80 (port exposé du conteneur)
#
#  Pré-requis sur le serveur :
#    - Docker installé et accessible par l'utilisateur du runner
#      (membre du groupe `docker` ou runner lancé en root)
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, chutex]
    steps:
      - uses: actions/checkout@v4

      - name: Debug runner permissions
        run: |
          echo "user: $(whoami)"
          echo "id: $(id)"
          echo "groups: $(groups)"
          echo "--- docker test ---"
          docker version --format '{{.Server.Version}}' || true
          docker ps

      - name: Build Docker image
        working-directory: frontend
        run: |
          set -euo pipefail
          docker build \
            --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL }}" \
            --build-arg REACT_APP_VAPID_KEY="${{ vars.REACT_APP_VAPID_KEY }}" \
            -t chutex-website:latest \
            -t chutex-website:${{ github.sha }} \
            .

      - name: Restart container
        env:
          WEB_PORT: ${{ vars.WEB_PORT || '80' }}
        run: |
          set -euo pipefail
          CONTAINER_NAME="chutex-website"

          echo "→ Stop & remove old container (si existant)"
          docker stop  "$CONTAINER_NAME" 2>/dev/null || true
          docker rm    "$CONTAINER_NAME" 2>/dev/null || true

          echo "→ Run new container on port $WEB_PORT"
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$WEB_PORT:80" \
            chutex-website:latest

          echo "→ Cleanup old images (>7 jours)"
          docker image prune -af --filter "until=168h" || true

          echo "✅ Deploy OK"

      - name: Healthcheck
        env:
          WEB_PORT: ${{ vars.WEB_PORT || '80' }}
        run: |
          set -euo pipefail
          sleep 3
          for i in 1 2 3 4 5; do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/healthz"; then
              echo "✅ Site répond"
              exit 0
            fi
            echo "  → tentative $i/5, retry dans 3s..."
            sleep 3
          done
          echo "❌ Healthcheck failed"
          docker logs --tail 50 chutex-website || true
          exit 1
