name: Deploy frontend

# ─────────────────────────────────────────────────────────────────
#  Build l'image Docker du site web et la connecte au réseau
#  `proxy-net` (nginx-proxy + acme-companion).
#
#  Variables (Settings → Variables) :
#    - REACT_APP_BACKEND_URL : ex. https://api.chutex-care.fr
#    - REACT_APP_VAPID_KEY   : (optionnel) clé Web Push publique
#    - VIRTUAL_HOST          : ex. www.chutex-care.fr,chutex-care.fr
#    - LETSENCRYPT_HOST      : idem (souvent identique à VIRTUAL_HOST)
#    - LETSENCRYPT_EMAIL     : email pour les certs Let's Encrypt
#
#  Pré-requis :
#    - La stack proxy doit déjà tourner (workflow `deploy-proxy.yml`)
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, chutex]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: frontend
        run: |
          set -euo pipefail
          docker build \
            --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL }}" \
            --build-arg REACT_APP_VAPID_KEY="${{ vars.REACT_APP_VAPID_KEY }}" \
            -t chutex-website:latest \
            -t chutex-website:${{ github.sha }} \
            .

      - name: Ensure proxy-net network exists
        run: |
          set -euo pipefail
          docker network inspect proxy-net >/dev/null 2>&1 || \
            docker network create proxy-net

      - name: Restart container
        env:
          VIRTUAL_HOST: ${{ vars.VIRTUAL_HOST || 'prod.chutex-innovation.com' }}
          LETSENCRYPT_HOST: ${{ vars.LETSENCRYPT_HOST || 'prod.chutex-innovation.com' }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL || 'contact@chutex-innovation.com' }}
        run: |
          set -euo pipefail
          CONTAINER_NAME="frontend"

          echo "→ Stop & remove old container (si existant)"
          docker stop  "$CONTAINER_NAME" 2>/dev/null || true
          docker rm    "$CONTAINER_NAME" 2>/dev/null || true
          # Migration : supprime aussi l'ancien nom si présent
          docker stop chutex-website 2>/dev/null || true
          docker rm   chutex-website 2>/dev/null || true

          echo "→ Run new container (sur le réseau proxy-net)"
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network proxy-net \
            -e VIRTUAL_HOST="$VIRTUAL_HOST" \
            -e VIRTUAL_PORT=80 \
            -e LETSENCRYPT_HOST="$LETSENCRYPT_HOST" \
            -e LETSENCRYPT_EMAIL="$LETSENCRYPT_EMAIL" \
            chutex-website:latest

          echo "→ Cleanup old images (>7 jours)"
          docker image prune -af --filter "until=168h" || true

          echo "✅ Deploy OK — VIRTUAL_HOST=$VIRTUAL_HOST"

      - name: Healthcheck (interne via proxy-net)
        run: |
          set -euo pipefail
          sleep 3
          docker run --rm --network proxy-net curlimages/curl:latest \
            -fsS http://frontend/healthz \
            && echo "✅ Site répond en interne" \
            || (docker logs --tail 30 frontend && exit 1)
