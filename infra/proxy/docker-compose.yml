# ────────────────────────────────────────────────────────────────
#  Stack proxy : nginx-proxy + acme-companion (Let's Encrypt auto)
#
#  Tous les conteneurs applicatifs (frontend, API, ...) qui veulent
#  être exposés en HTTPS public se connectent au réseau `proxy-net`
#  et exposent les variables d'environnement :
#    - VIRTUAL_HOST=www.chutex-care.fr,chutex-care.fr
#    - VIRTUAL_PORT=80                  (port interne du conteneur)
#    - LETSENCRYPT_HOST=www.chutex-care.fr,chutex-care.fr
#    - LETSENCRYPT_EMAIL=contact@chutex-care.fr
#
#  Démarrage initial :
#    cd infra/proxy && docker compose up -d
#
#  Logs : docker compose logs -f nginx-proxy acme-companion
# ────────────────────────────────────────────────────────────────

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy-net
    environment:
      DEFAULT_HOST: prod.chutex-innovation.com
      ENABLE_IPV6: "true"
      # Limite globale d'upload (passe à 25M pour les avatars / contrats signés)
      CLIENT_MAX_BODY_SIZE: 25M

  acme-companion:
    image: nginxproxy/acme-companion:2.5
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-net
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:-contact@chutex-innovation.com}
      NGINX_PROXY_CONTAINER: nginx-proxy

networks:
  proxy-net:
    name: proxy-net
    external: true

volumes:
  certs:
  vhost:
  html:
  dhparam:
  acme:
