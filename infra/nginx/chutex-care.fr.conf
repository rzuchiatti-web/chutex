# ────────────────────────────────────────────────────────────────
#  Reverse-proxy nginx hôte → conteneur Docker du site Chutex Care
#  Le conteneur Docker écoute sur 127.0.0.1:${WEB_PORT} (8080 par défaut)
#  Ce vhost expose le site en HTTPS sur 443 et redirige le 80 → 443
# ────────────────────────────────────────────────────────────────

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.chutex-care.fr chutex-care.fr;

    # Let's Encrypt challenge (laisse passer)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chutex-care.fr chutex-care.fr;

    # ── Certificats Let's Encrypt ─────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/chutex-care.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chutex-care.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/chutex-care.fr/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── HSTS + en-têtes de sécurité ────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logs ────────────────────────────────────────────────────
    access_log /var/log/nginx/chutex-care.access.log;
    error_log  /var/log/nginx/chutex-care.error.log warn;

    # ── Tailles & timeouts ─────────────────────────────────────
    client_max_body_size 25M;
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Reverse-proxy vers le conteneur Docker ────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # ── Healthcheck direct (bypass de tout cache) ─────────────
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/healthz;
    }
}
